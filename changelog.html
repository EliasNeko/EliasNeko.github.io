<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新日志 · 龙潜猫隐</title>
<link rel="icon" href="assets/images/oc/favicon.png">
<style>
    :root {
        --bg: #05070f;
        --ink: #eef4fb;
        --muted: #9db0c8;
        --dim: #5f718a;
        --blue: #5fc6ff;
        --gold: #e8c98a;
        --line: rgba(120, 170, 240, 0.16);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        background:
            radial-gradient(1100px 620px at 50% -12%, rgba(38, 90, 190, 0.28), transparent 66%),
            radial-gradient(760px 520px at 96% 6%, rgba(120, 80, 220, 0.14), transparent 62%),
            var(--bg);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        line-height: 1.85;
        -webkit-font-smoothing: antialiased;
    }

    .wrap { width: min(880px, 100%); margin: 0 auto; padding: 56px 24px 96px; }

    .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 30px;
        padding: 6px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-decoration: none;
        transition: 0.3s;
    }
    .back:hover { border-color: rgba(95, 198, 255, 0.55); color: #fff; }

    .kicker { color: var(--dim); font-size: 11.5px; letter-spacing: 0.28em; font-family: Consolas, monospace; }

    h1 {
        margin: 12px 0 10px;
        font-size: clamp(30px, 5vw, 44px);
        letter-spacing: 0.04em;
        font-weight: 800;
        background: linear-gradient(100deg, #fff 12%, #a5e4ff 58%, var(--gold) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .lead { color: var(--muted); font-size: 14px; max-width: 46em; }

    .meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 8px; }
    .meta span {
        padding: 4px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 11.5px;
        color: var(--muted);
        font-family: Consolas, monospace;
        letter-spacing: 0.08em;
    }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 34px; }
    .chip {
        padding: 5px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: 0.25s;
    }
    .chip:hover { color: #fff; border-color: rgba(95, 198, 255, 0.45); }
    .chip.on { background: rgba(95, 198, 255, 0.14); border-color: rgba(95, 198, 255, 0.55); color: #eaf6ff; }

    .day { display: grid; grid-template-columns: 104px 1fr; gap: 22px; padding: 22px 0; }
    .day + .day { border-top: 1px solid rgba(120, 170, 240, 0.09); }

    .rail { position: relative; padding-top: 2px; }
    .rail time {
        display: block;
        font-family: Consolas, monospace;
        font-size: 20px;
        color: #dcecff;
        letter-spacing: 0.04em;
    }
    .rail .yr { display: block; font-family: Consolas, monospace; font-size: 11px; color: var(--dim); letter-spacing: 0.16em; }
    .rail .today {
        display: inline-block;
        margin-top: 8px;
        padding: 1px 9px;
        border-radius: 999px;
        background: rgba(232, 201, 138, 0.14);
        border: 1px solid rgba(232, 201, 138, 0.35);
        color: var(--gold);
        font-size: 10.5px;
        letter-spacing: 0.1em;
    }

    .items { display: flex; flex-direction: column; gap: 10px; }

    .item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 16px;
        background: rgba(18, 24, 36, 0.55);
        border: 1px solid rgba(120, 170, 240, 0.1);
        border-left: 2px solid rgba(95, 198, 255, 0.45);
        border-radius: 12px;
        transition: 0.25s;
    }
    .item:hover { border-left-color: var(--blue); background: rgba(24, 34, 52, 0.72); transform: translateX(2px); }

    .tag {
        flex: none;
        margin-top: 3px;
        padding: 1px 9px;
        border-radius: 999px;
        background: rgba(95, 198, 255, 0.1);
        color: #9fd9ff;
        font-size: 11px;
        letter-spacing: 0.06em;
        white-space: nowrap;
    }

    .txt { font-size: 13.6px; color: #dbe7f6; }

    .state { padding: 40px 0; color: var(--muted); font-size: 14px; }
    .state.err { color: #e29a8e; }

    .foot { margin-top: 54px; color: var(--dim); font-size: 12px; text-align: center; }
    .foot a { color: var(--muted); text-decoration: none; border-bottom: 1px solid rgba(120, 170, 240, 0.25); }

    @media (max-width: 620px) {
        .wrap { padding: 40px 18px 72px; }
        .day { grid-template-columns: 1fr; gap: 12px; }
        .rail { display: flex; align-items: baseline; gap: 10px; }
        .rail time { font-size: 17px; }
        .rail .today { margin-top: 0; }
        .item { padding: 11px 13px; }
        .txt { font-size: 13px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="index.html">← 回到主页</a>

    <p class="kicker">CHANGELOG</p>
    <h1>这个站，是这么一点点长出来的</h1>
    <p class="lead">每次动了哪儿都记在这里。上面是最近改的，往下翻能看到最早的样子。</p>

    <div class="meta" id="meta"></div>
    <div class="filters" id="filters"></div>
    <main id="list"><p class="state">正在读取…</p></main>

    <p class="foot">数据来自 <a href="CHANGELOG.txt">CHANGELOG.txt</a> · 龙潜猫隐 · 2026</p>
</div>

<script>
(function () {
    var listEl = document.getElementById("list");
    var metaEl = document.getElementById("meta");
    var filterEl = document.getElementById("filters");
    var days = [];
    var activeTag = "";

    function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function todayKey() {
        var d = new Date();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var dd = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + dd;
    }

    function parse(text) {
        var out = [];
        var cur = null;
        text.split(/\r?\n/).forEach(function (raw) {
            var line = raw.trim();
            if (!line) return;
            var m = line.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (m) {
                cur = { date: line, y: m[1], mm: m[2], dd: m[3], items: [] };
                out.push(cur);
                return;
            }
            if (!cur) return;
            var idx = line.indexOf("：");
            var tag = "其它";
            var body = line;
            if (idx > 0 && idx <= 6) {
                tag = line.slice(0, idx);
                body = line.slice(idx + 1);
            }
            cur.items.push({ tag: tag, text: body });
        });
        out.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        return out;
    }

    function render() {
        var html = "";
        var total = 0;
        var shown = 0;
        days.forEach(function (d) {
            var items = d.items.filter(function (it) { return !activeTag || it.tag === activeTag; });
            total += d.items.length;
            if (!items.length) return;
            shown += items.length;
            html += '<section class="day"><div class="rail"><time>' + d.mm + '.' + d.dd + '</time>' +
                '<span class="yr">' + d.y + '</span>' +
                (d.date === todayKey() ? '<span class="today">今天</span>' : '') +
                '</div><div class="items">';
            items.forEach(function (it) {
                html += '<article class="item"><span class="tag">' + esc(it.tag) + '</span>' +
                    '<p class="txt">' + esc(it.text) + '</p></article>';
            });
            html += '</div></section>';
        });
        listEl.innerHTML = html || '<p class="state">这一类还没有记录。</p>';
        metaEl.innerHTML = '<span>' + days.length + ' 天</span><span>' + total + ' 条更新</span>' +
            (activeTag ? '<span>筛选：' + esc(activeTag) + ' · ' + shown + ' 条</span>' : '');
    }

    function buildFilters() {
        var tags = {};
        days.forEach(function (d) { d.items.forEach(function (it) { tags[it.tag] = (tags[it.tag] || 0) + 1; }); });
        var arr = Object.keys(tags).sort(function (a, b) { return tags[b] - tags[a]; }).slice(0, 8);
        var html = '<button class="chip on" data-tag="">全部</button>';
        arr.forEach(function (t) {
            html += '<button class="chip" data-tag="' + esc(t) + '">' + esc(t) + ' <span style="opacity:.5">' + tags[t] + '</span></button>';
        });
        filterEl.innerHTML = html;
        filterEl.addEventListener("click", function (e) {
            var b = e.target.closest(".chip");
            if (!b) return;
            activeTag = b.getAttribute("data-tag") || "";
            filterEl.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("on", c === b); });
            render();
        });
    }

    fetch("CHANGELOG.txt", { cache: "no-store" })
        .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
        })
        .then(function (text) {
            days = parse(text);
            if (!days.length) throw new Error("空的");
            buildFilters();
            render();
        })
        .catch(function () {
            listEl.innerHTML = '<p class="state err">没读到 CHANGELOG.txt（直接双击打开的本地文件读不了，起个本地服务器或看线上版）。</p>';
        });
})();
</script>
</body>
</html>
