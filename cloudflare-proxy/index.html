<h1>Supabase Proxy</h1>
<p>这个 Pages 站点只做一件事：把 <code>/rest/v1/*</code> 转发到 Supabase。</p>
<p>部署后在 <code>coffee-site/config.js</code> 里把 <code>SUPABASE_PROXY</code> 填成这个站点的地址。</p>
