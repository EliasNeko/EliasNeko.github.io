<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会员登记 · 龙潜猫隐的咖啡店</title>
<link rel="stylesheet" href="../assets/owner-badge.css?v=20261028" data-owner-badge="1">
<link rel="stylesheet" href="../assets/titles.css?v=20261032" data-titles-badge="1">
<style>
    /* 咖啡店的配色：深褐底 + 金线 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        padding: 44px 20px 90px;
        font-family: "Microsoft YaHei", sans-serif;
        color: #f3e7d3;
        background: radial-gradient(circle at 50% 0%, #33251a 0%, #14100e 62%);
    }

    .wrap { width: min(480px, 100%); margin: 0 auto; }

    .back {
        display: inline-block;
        margin-bottom: 26px;
        color: rgba(201, 183, 156, 0.75);
        font-size: 13px;
        letter-spacing: 2px;
        text-decoration: none;
    }
    .back:hover { color: #c9a86a; }

    .kicker { color: #c9a86a; font-size: 12px; letter-spacing: 6px; margin-bottom: 10px; }

    h1 { font-size: 30px; font-weight: normal; letter-spacing: 4px; margin-bottom: 10px; }

    .sub { color: #c9b79c; font-size: 13px; line-height: 1.9; margin-bottom: 26px; }

    .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        border-bottom: 1px solid rgba(201, 168, 106, 0.18);
    }

    .tab {
        padding: 12px 22px;
        border: 0;
        background: transparent;
        color: rgba(201, 183, 156, 0.6);
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 3px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: 0.25s;
    }
    .tab:hover { color: #e8d6b4; }
    .tab.active { color: #c9a86a; border-bottom-color: #c9a86a; }

    .card {
        padding: 26px 24px;
        background: #1a1512;
        border: 1px solid rgba(201, 168, 106, 0.22);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .field { margin-bottom: 16px; }

    label { display: block; margin-bottom: 7px; color: #c9b79c; font-size: 12px; letter-spacing: 2px; }
    label .opt { color: rgba(201, 183, 156, 0.45); letter-spacing: 1px; }

    input[type="text"], input[type="password"], input[type="email"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(201, 168, 106, 0.22);
        border-radius: 10px;
        background: #14100e;
        color: #f3e7d3;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: 0.25s;
    }

    input:focus { border-color: rgba(201, 168, 106, 0.6); box-shadow: 0 0 0 3px rgba(201, 168, 106, 0.08); }
    input::placeholder { color: rgba(201, 183, 156, 0.35); }

    .submit {
        width: 100%;
        margin-top: 6px;
        padding: 13px 20px;
        border: 1px solid #c9a86a;
        border-radius: 999px;
        background: #c9a86a;
        color: #14100e;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 4px;
        cursor: pointer;
        transition: 0.25s;
    }
    .submit:hover { background: #dcbe86; border-color: #dcbe86; }
    .submit:disabled { opacity: 0.45; cursor: not-allowed; }

    .msg { min-height: 22px; margin-top: 14px; font-size: 13px; line-height: 1.8; letter-spacing: 1px; }
    .msg.ok { color: #9ec9a0; }
    .msg.err { color: #e29a8e; }

    .hidden { display: none; }

    .quota {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px dashed rgba(201, 168, 106, 0.16);
        color: rgba(201, 183, 156, 0.55);
        font-size: 12px;
        letter-spacing: 1px;
        line-height: 1.9;
    }

    .session {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        padding: 12px 16px;
        border: 1px solid rgba(201, 168, 106, 0.28);
        border-radius: 12px;
        background: rgba(201, 168, 106, 0.08);
        font-size: 13px;
        letter-spacing: 1px;
        color: #e8d6b4;
    }
    .session.show { display: flex; }
    .session button {
        border: 0; background: transparent;
        color: rgba(201, 183, 156, 0.7);
        font-family: inherit; font-size: 12px; letter-spacing: 1px;
        cursor: pointer; text-decoration: underline;
    }
    .session button:hover { color: #c9a86a; }

    .avatar-title { margin: 0 0 14px; font-size: 14px; font-weight: normal; letter-spacing: 3px; color: #c9a86a; }
    .avatar-row { display: flex; gap: 18px; align-items: flex-start; }
    .avatar-preview { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(201,168,106,.45); background: #14100e; }
    .avatar-side { flex: 1; min-width: 0; }
    .avatar-side input[type="file"] { width: 100%; color: #c9b79c; font-size: 12px; margin-bottom: 8px; }
    .avatar-side .submit { margin-top: 10px; }

    .logged-row { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
    .logged-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(201,168,106,.45); background: #14100e; }
    .logged-name { margin: 0 0 6px; font-size: 18px; letter-spacing: 2px; color: #f3e7d3; }
    .logged-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .logged-actions .submit { flex: 1 1 150px; margin-top: 0; }
    .logged-note { margin: 14px 0 0; font-size: 12px; line-height: 1.9; color: rgba(201,183,156,.5); }

    .admin-link {
        display: block;
        margin-top: 22px;
        padding: 14px 18px;
        border: 1px dashed rgba(201, 168, 106, 0.2);
        border-radius: 12px;
        color: rgba(201, 183, 156, 0.55);
        font-size: 12px;
        letter-spacing: 1px;
        text-decoration: none;
        transition: 0.25s;
    }
    .admin-link:hover { color: #c9a86a; border-color: rgba(201, 168, 106, 0.4); }

    .wx-tip {
        display: none;
        margin-bottom: 16px;
        padding: 12px 14px;
        border: 1px solid rgba(201, 168, 106, 0.35);
        border-radius: 12px;
        background: rgba(201, 168, 106, 0.08);
        color: #e8d6b4;
        font-size: 12.5px;
        line-height: 1.9;
        letter-spacing: .5px;
    }
    .wx-tip.show { display: block; }
    .wx-tip b { color: #c9a86a; font-weight: normal; }

    .foot {
        margin-top: 26px;
        text-align: center;
        color: rgba(201, 183, 156, 0.35);
        font-size: 11.5px;
        letter-spacing: 2px;
        line-height: 2;
    }
</style>
</head>
<body>

<div class="wrap">
    <a class="back" href="index.html">← 回到店里</a>

    <div class="session" id="sessionBar">
        <span id="sessionText"></span>
        <button id="logoutBtn" type="button">退出登录</button>
    </div>

    <p class="kicker">龙 潜 猫 隐 的 咖 啡 店</p>
    <h1>会员登记</h1>
    <p class="sub">登记之后，进「私人学习企划」不用再输口令；没登记的客人，仍然是游客。</p>

    <div class="wx-tip" id="wxTip">
        你正在<b>微信内置浏览器</b>里打开。微信有时连不上云端，登录失败就点右上角「⋯」→「在浏览器打开」。
    </div>

    <section class="card" id="panelLogged" style="display:none;">
        <div class="logged-row">
            <img class="logged-avatar" id="loggedAvatar" alt="">
            <div>
                <p class="logged-name" id="loggedName"></p>
                <p class="hint">你已登录。资料和头像可以在个人资料页里改。</p>
            </div>
        </div>
        <div class="logged-actions">
            <a class="submit" href="profile.html" style="text-align:center; text-decoration:none; line-height:1.4;">个 人 资 料</a>
            <button class="submit" id="loggedLogout" type="button" style="background:none; color:#c9a86a;">退 出 登 录</button>
        </div>
        <p class="logged-note">退出后回到游客身份：每天余额 ¥60，也没有咖啡收藏。</p>
    </section>

    <div class="tabs">
        <button class="tab active" id="tabLogin" type="button">登 录</button>
        <button class="tab" id="tabRegister" type="button">注 册</button>
    </div>

    <section class="card" id="panelLogin">
        <form id="loginForm" autocomplete="off">
            <div class="field">
                <label for="loginName">用户名</label>
                <input type="text" id="loginName" placeholder="登记时填的用户名">
            </div>
            <div class="field">
                <label for="loginPass">密码</label>
                <input type="password" id="loginPass" placeholder="密码">
            </div>
            <button class="submit" type="submit">进 入</button>
            <p class="msg" id="loginMsg"></p>
        </form>
    </section>

    <section class="card hidden" id="panelRegister">
        <form id="regForm" autocomplete="off">
            <div class="field">
                <label for="regName">用户名</label>
                <input type="text" id="regName" placeholder="2 - 12 个字，登录时用">
            </div>
            <div class="field">
                <label for="regPass">密码</label>
                <input type="password" id="regPass" placeholder="至少 4 位">
            </div>
            <div class="field">
                <label for="regPass2">确认密码</label>
                <input type="password" id="regPass2" placeholder="再输一次">
            </div>
            <div class="field">
                <label for="regContact">QQ 号 或 微信号</label>
                <input type="text" id="regContact" placeholder="留一个能找到你的">
            </div>
            <div class="field">
                <label for="regEmail">邮箱 <span class="opt">（选填）</span></label>
                <input type="email" id="regEmail" placeholder="不填也可以">
            </div>
            <button class="submit" id="regBtn" type="submit">登 记</button>
            <p class="msg" id="regMsg"></p>
        </form>
        <p class="quota" id="quota">这台设备还能登记 2 个账号</p>
    </section>

    <section class="card hidden" id="panelAvatar">
        <h3 class="avatar-title">我 的 头 像</h3>
        <div class="avatar-row">
            <img class="avatar-preview" id="avatarPreview" alt="">
            <div class="avatar-side">
                <input type="file" id="avatarFile" accept="image/*">
                <p class="hint">上传后会自动裁成正方形并压缩，头像更清楚，加载也更快。</p>
                <button class="submit" id="avatarSave" type="button" disabled>保 存 头 像</button>
            </div>
        </div>
        <p class="msg" id="avatarMsg"></p>
    </section>

    <a class="admin-link" href="admin.html">注册名单 · 站长后台（加密 / 解密 / 导出）→</a>

    <p class="foot">
        密码以哈希形式保存，公开名单里看不到明文。<br />
        © 2026 龙潜猫隐
    </p>
</div>

<script src="config.js?v=20261024"></script>
<script src="member.js?v=20261025"></script>
<script src="../assets/titles.js?v=20261032"></script>
<script>
(function () {
    "use strict";

    var MAX_PER_DEVICE = 2;

    /* 微信内置浏览器经常连不上第三方接口，提前说一声 */
    var inWeChat = /MicroMessenger/i.test(navigator.userAgent);
    if (inWeChat) {
        var wxTip = document.getElementById("wxTip");
        if (wxTip) wxTip.classList.add("show");
    }

    var tabLogin = document.getElementById("tabLogin");
    var tabRegister = document.getElementById("tabRegister");
    var panelLogin = document.getElementById("panelLogin");
    var panelRegister = document.getElementById("panelRegister");

    var loginForm = document.getElementById("loginForm");
    var regForm = document.getElementById("regForm");
    var loginMsg = document.getElementById("loginMsg");
    var regMsg = document.getElementById("regMsg");
    var quota = document.getElementById("quota");

    var remoteUsers = [];

    /* 后端地址：留空 = 和网页同一个地址（用 java Server 打开网页时就是这样）。
       以后后端部署到别的域名，把这里改成 https://你的域名 即可。 */
    var API = window.COFFEE_API || "";
    var serverMode = false;

    /* Supabase：有这两个值就走云端，不用开电脑 */
    var SB_URL = window.SUPABASE_PROXY || window.SUPABASE_URL || "";
    var SB_KEY = window.SUPABASE_KEY || "";
    var sbMode = !!(SB_URL && SB_KEY);

    /* 带超时的请求：手机网络差时不要一直转圈 */
    function fetchTimeout(url, opts, ms) {
        opts = opts || {};
        if (typeof AbortController === "undefined") return fetch(url, opts);
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, ms || 20000);
        var o = {};
        for (var k in opts) { if (Object.prototype.hasOwnProperty.call(opts, k)) o[k] = opts[k]; }
        o.signal = ctrl.signal;
        return fetch(url, o).then(function (r) { clearTimeout(timer); return r; },
            function (e) { clearTimeout(timer); throw e; });
    }

    var SB_HEADERS = {
        "apikey": SB_KEY,
        "Authorization": "Bearer " + SB_KEY,
        "Content-Type": "application/json"
    };

    function cloudFail(err) {
        if (err && err.status) return "云端返回 HTTP " + err.status + "，稍后再试。";
        if (err && (err.name === "AbortError" || /abort|timeout|超时/i.test(String(err.message || "")))) {
            return "云端 20 秒没响应，可能网络太慢。换 Wi-Fi / 手机流量，或开 VPN 再试。";
        }
        return "当前网络访问不了 supabase.co（连接被重置），不是账号问题。换 Wi-Fi / 手机流量，或开 VPN 再试。" +
            (inWeChat ? " 微信里也可以点右上角「⋯」→「在浏览器打开」。" : "");
    }

    /* 注册：交给 Supabase 的函数，一次写两张表 */
    function sbRegister(user, finish, fail) {
        fetchTimeout(SB_URL + "/rest/v1/rpc/register_user", {
            method: "POST",
            headers: SB_HEADERS,
            body: JSON.stringify({
                p_name: user.name,
                p_salt: user.salt,
                p_hash: user.hash,
                p_contact: user.contact,
                p_email: user.email,
                p_device: user.device,
                p_time: user.time
            })
        }).then(function (res) {
            if (!res.ok) {
                var e = new Error("HTTP " + res.status);
                e.status = res.status;
                throw e;
            }
            return res.json();
        }).then(function (out) {
            if (out && out.ok) return finish("登记成功，正在带你回店里…");
            if (out && out.error === "duplicate") return fail("这个名字已经有人用了，换一个吧。");
            return fail("登记没成功，稍后再试（" + (out && out.error ? out.error : "未知原因") + "）。");
        }).catch(function (err) {
            fail(cloudFail(err));
        });
    }

    /* 登录：先按名字取盐，再让服务器比对哈希 */
    function sbLogin(name, pass, done, fail) {
        var lastHash = "";
        fetchTimeout(SB_URL + "/rest/v1/users?select=salt&name=eq." + encodeURIComponent(name), {
            headers: SB_HEADERS
        }, 20000).then(function (res) {
            if (!res.ok) {
                var e2 = new Error("HTTP " + res.status);
                e2.status = res.status;
                throw e2;
            }
            return res.json();
        }).then(function (rows) {
            if (!rows || !rows.length) {
                fail("没找到这个账号，用户名或密码不对。");
                return;
            }
            return Member.hashPass(pass, rows[0].salt).then(function (h) {
                lastHash = h;
                return fetchTimeout(SB_URL + "/rest/v1/rpc/check_login", {
                    method: "POST",
                    headers: SB_HEADERS,
                    body: JSON.stringify({ p_name: name, p_hash: h })
                }, 20000);
            }).then(function (res) {
                if (!res.ok) {
                    var e3 = new Error("HTTP " + res.status);
                    e3.status = res.status;
                    throw e3;
                }
                return res.json();
            }).then(function (ok) {
                if (ok === true) done(lastHash);
                else fail("没找到这个账号，用户名或密码不对。");
            });
        }).catch(function (err) {
            fail(cloudFail(err));
        });
    }

    function checkServer() {
        if (typeof fetch !== "function") return;
        fetch(API + "/api/health", { cache: "no-store", headers: { "ngrok-skip-browser-warning": "1" } })
            .then(function (r) { serverMode = r.ok; })
            .catch(function () { serverMode = false; });
    }

    if (!Member.ok()) {
        alert(inWeChat
            ? "微信内置浏览器不支持加密接口。请点右上角「⋯」→「在浏览器打开」再注册。"
            : "这个浏览器不支持加密接口，请用较新的 Chrome 或 Edge 打开。");
    }

    /* 线上公开名单：只有用户名、盐、哈希 */
    function loadRemote() {
        if (typeof fetch !== "function") return;
        fetch("users.json", { cache: "no-store" })
            .then(function (res) { return res.ok ? res.json() : []; })
            .then(function (data) {
                if (Object.prototype.toString.call(data) === "[object Array]") remoteUsers = data;
            })
            .catch(function () { /* 本地打开时读不到，忽略 */ });
    }

    function allNames() {
        var names = remoteUsers.map(function (u) { return u.name; });
        Member.localUsers().forEach(function (u) {
            if (names.indexOf(u.name) < 0) names.push(u.name);
        });
        return names;
    }

    function sameDevice() {
        var id = Member.deviceId();
        return Member.localUsers().filter(function (u) { return u.device === id; });
    }

    function refreshQuota() {
        var used = sameDevice().length;
        var left = MAX_PER_DEVICE - used;
        quota.textContent = left > 0
            ? "这台设备还能登记 " + left + " 个账号"
            : "这台设备已经登记满 " + MAX_PER_DEVICE + " 个账号了";
        document.getElementById("regBtn").disabled = left <= 0;
    }

    function showLogin() {
        panelLogin.classList.remove("hidden");
        panelRegister.classList.add("hidden");
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        loginMsg.textContent = "";
    }

    function showRegister() {
        panelRegister.classList.remove("hidden");
        panelLogin.classList.add("hidden");
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        regMsg.textContent = "";
        refreshQuota();
    }

    tabLogin.addEventListener("click", showLogin);
    tabRegister.addEventListener("click", showRegister);

    /* ---------- 注册 ---------- */
    regForm.addEventListener("submit", function (e) {
        e.preventDefault();

        var name = document.getElementById("regName").value.trim();
        var pass = document.getElementById("regPass").value;
        var pass2 = document.getElementById("regPass2").value;
        var contact = document.getElementById("regContact").value.trim();
        var email = document.getElementById("regEmail").value.trim();

        function fail(text) {
            regMsg.className = "msg err";
            regMsg.textContent = text;
        }

        if (name.length < 2 || name.length > 12) return fail("用户名要 2 到 12 个字。");
        if (/\s/.test(name)) return fail("用户名里不能有空格。");
        if (pass.length < 4) return fail("密码至少 4 位。");
        if (pass !== pass2) return fail("两次输入的密码不一样。");
        if (!contact) return fail("留一个 QQ 号或微信号吧，方便找到你。");
        if (email && email.indexOf("@") < 0) return fail("邮箱格式看着不对。");
        if (sameDevice().length >= MAX_PER_DEVICE) {
            return fail("这台设备已经登记满 " + MAX_PER_DEVICE + " 个账号了。");
        }
        if (allNames().indexOf(name) >= 0) return fail("这个名字已经有人用了，换一个吧。");

        var salt = Member.randomHex(16);

        Member.hashPass(pass, salt).then(function (hash) {
            var user = {
                name: name,
                pass: pass,          /* 只留在本机，用来给站长看 */
                salt: salt,
                hash: hash,          /* 公开名单里只放这个 */
                contact: contact,
                email: email,
                time: Member.nowStr(),
                created: Member.nowStr().slice(0, 10),
                device: Member.deviceId()
            };

            function finish(text) {
                var list = Member.localUsers();
                list.push(user);
                if (!Member.write(Member.USERS_KEY, list)) {
                    return fail("浏览器不让存数据，检查一下隐私设置。");
                }

                var pub = Member.publicEntries();
                pub.push(Member.toPublic(user));
                Member.write(Member.PUBLIC_KEY, pub);

                Member.saveSession(name, hash);

                regMsg.className = "msg ok";
                regMsg.textContent = text;
                refreshQuota();

                setTimeout(function () { window.location.href = "index.html"; }, 1200);
            }

            /* 优先走 Supabase（不用开电脑） */
            if (sbMode) return sbRegister(user, finish, fail);

            /* 连不上后端时，退回到「只记在本机」 */
            if (!serverMode) return finish("登记好了，正在带你回店里…");

            fetch(API + "/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
                body: JSON.stringify({
                    name: user.name,
                    salt: user.salt,
                    hash: user.hash,
                    contact: user.contact,
                    email: user.email,
                    time: user.time,
                    device: user.device
                })
            }).then(function (res) {
                if (res.status === 409) return fail("这个名字已经有人用了，换一个吧。");
                if (!res.ok) return fail("服务器没存上（" + res.status + "），等会儿再试。");
                finish("登记成功，正在带你回店里…");
            }).catch(function () {
                finish("服务器暂时连不上，先记在这台设备上，正在带你回店里…");
            });
        }).catch(function () {
            fail("密码处理失败，换个浏览器试试。");
        });
    });

    /* ---------- 登录 ---------- */
    loginForm.addEventListener("submit", function (e) {
        e.preventDefault();

        var name = document.getElementById("loginName").value.trim();
        var pass = document.getElementById("loginPass").value;

        function fail(text) {
            loginMsg.className = "msg err";
            loginMsg.textContent = text;
        }

        if (!name || !pass) return fail("用户名和密码都要填。");

        function done(hash) {
            Member.saveSession(name, hash);
            loginMsg.className = "msg ok";
            loginMsg.textContent = "登录成功，正在带你回店里…";
            setTimeout(function () { window.location.href = "index.html"; }, 900);
        }

        /* 没有后端时：先看本机，再看线上公开名单 */
        function localLogin() {
            var local = Member.localUsers().filter(function (u) { return u.name === name; })[0];
            if (local) {
                Member.hashPass(pass, local.salt).then(function (h) {
                    if (h === local.hash) done(h);
                    else fail("没找到这个账号，用户名或密码不对。");
                });
                return;
            }

            var entry = remoteUsers.filter(function (u) { return u.name === name; })[0];
            if (!entry) return fail("没找到这个账号，用户名或密码不对。");

            Member.hashPass(pass, entry.salt).then(function (h) {
                if (h === entry.hash) done(h);
                else fail("没找到这个账号，用户名或密码不对。");
            });
        }

        /* 优先走 Supabase */
        if (sbMode) {
            sbLogin(name, pass, done, fail);
            return;
        }

        /* 有后端：问服务器。密码原文不外发，只发算好的哈希 */
        if (serverMode) {
            fetch(API + "/api/salt?name=" + encodeURIComponent(name), { cache: "no-store", headers: { "ngrok-skip-browser-warning": "1" } })
                .then(function (res) {
                    if (!res.ok) throw new Error("no-user");
                    return res.json();
                })
                .then(function (data) {
                    return Member.hashPass(pass, data.salt).then(function (h) {
                        return fetch(API + "/api/login", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
                            body: JSON.stringify({ name: name, hash: h })
                        });
                    });
                })
                .then(function (res) {
                    if (res.ok) done();
                    else fail("没找到这个账号，用户名或密码不对。");
                })
                .catch(function () { localLogin(); });
            return;
        }

        localLogin();
    });

    /* ---------- 头像 ---------- */
    var pendingAvatar = null;

    function compressImage(file, size, quality) {
        return new Promise(function (resolve, reject) {
            var img = new Image();
            var url = URL.createObjectURL(file);
            img.onload = function () {
                var canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;
                var ctx = canvas.getContext("2d");
                var s = Math.min(img.width, img.height);
                var sx = (img.width - s) / 2;
                var sy = (img.height - s) / 2;
                ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("bad-image")); };
            img.src = url;
        });
    }

    function renderAvatarPanel() {
        var panel = document.getElementById("panelAvatar");
        if (!panel) return;

        var me = Member.session();
        if (!sbMode || !me || !me.name) {
            panel.classList.add("hidden");
            return;
        }
        panel.classList.remove("hidden");

        var img = document.getElementById("avatarPreview");
        var cached = null;
        try { cached = localStorage.getItem("coffee-avatar:" + me.name); } catch (e) {}
        if (cached) img.src = cached;

        if (!cached) {
            fetchTimeout(SB_URL + "/rest/v1/rpc/get_avatar", {
                method: "POST",
                headers: SB_HEADERS,
                body: JSON.stringify({ p_name: me.name })
            }, 8000).then(function (r) { return r.ok ? r.json() : null; })
              .then(function (data) {
                  if (typeof data === "string" && data) {
                      img.src = data;
                      try { localStorage.setItem("coffee-avatar:" + me.name, data); } catch (e) {}
                  }
              }).catch(function () {});
        }
    }

    document.getElementById("avatarFile").addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        var msg = document.getElementById("avatarMsg");
        if (!file) return;

        if (file.size > 8 * 1024 * 1024) {
            msg.className = "msg err";
            msg.textContent = "图片太大了，换一张小于 8MB 的。";
            return;
        }

        compressImage(file, 128, 0.8).then(function (dataUrl) {
            pendingAvatar = dataUrl;
            document.getElementById("avatarPreview").src = dataUrl;
            document.getElementById("avatarSave").disabled = false;
            msg.className = "msg ok";
            msg.textContent = "预览可以吗？满意就点保存。";
        }).catch(function () {
            msg.className = "msg err";
            msg.textContent = "这张图读不出来，换一张试试。";
        });
    });

    document.getElementById("avatarSave").addEventListener("click", function () {
        var msg = document.getElementById("avatarMsg");
        var me = Member.session();

        if (!pendingAvatar) { msg.className = "msg err"; msg.textContent = "先选一张图。"; return; }
        if (!me || !me.name) { msg.className = "msg err"; msg.textContent = "先登录。"; return; }
        if (!me.hash) { msg.className = "msg err"; msg.textContent = "登录信息过期了，重新登录一次就能传。"; return; }

        msg.className = "msg";
        msg.textContent = "正在保存…";

        fetchTimeout(SB_URL + "/rest/v1/rpc/set_avatar", {
            method: "POST",
            headers: SB_HEADERS,
            body: JSON.stringify({ p_name: me.name, p_hash: me.hash, p_data: pendingAvatar })
        }, 15000).then(function (r) { return r.ok ? r.json() : null; })
          .then(function (out) {
              if (out && out.ok) {
                  try { localStorage.setItem("coffee-avatar:" + me.name, pendingAvatar); } catch (e) {}
                  msg.className = "msg ok";
                  msg.textContent = "保存好了，回店里就能在右上角看到。";
              } else {
                  msg.className = "msg err";
                  msg.textContent = "没存上：" + (out && out.error === "auth" ? "身份校验没过，重新登录一下。" : "云端出错了。");
              }
          })
          .catch(function () {
              msg.className = "msg err";
              msg.textContent = "连不上云端，稍后再试。";
          });
    });

    /* ---------- 登录状态条 ---------- */
    function renderSession() {
        var me = Member.session();
        var bar = document.getElementById("sessionBar");
        var logged = document.getElementById("panelLogged");
        var tabs = document.querySelector(".tabs");
        var loginPanel = document.getElementById("panelLogin");
        var regPanel = document.getElementById("panelRegister");

        if (me && me.name) {
            bar.classList.add("show");
            document.getElementById("sessionText").innerHTML = "已登录：" + (window.Titles ? Titles.nameHTML(me.name) : Member.displayName(me.name)) + " · 进书房不用口令了";
            document.getElementById("loginName").value = me.name;

            if (logged) logged.style.display = "block";
            if (tabs) tabs.style.display = "none";
            if (loginPanel) loginPanel.classList.add("hidden");
            if (regPanel) regPanel.classList.add("hidden");

            document.getElementById("loggedName").innerHTML = window.Titles ? Titles.nameHTML(me.name, "lg") : Member.displayName(me.name, "lg");
            if (Member.isOwner(me.name)) {
                var row = document.querySelector("#panelLogged .logged-row");
                if (row) row.classList.add("owner-row");
                var panel = document.getElementById("panelLogged");
                if (panel) panel.classList.add("owner-card");
            }
            var av = document.getElementById("loggedAvatar");
            if (Member.isOwner(me.name)) av.classList.add("owner-avatar-ring");
            var cached = null;
            try { cached = localStorage.getItem("coffee-avatar:" + me.name); } catch (e) {}
            if (cached) av.src = cached;
        } else {
            bar.classList.remove("show");
            if (logged) logged.style.display = "none";
            if (tabs) tabs.style.display = "";
        }
    }

    document.getElementById("loggedLogout").addEventListener("click", function () {
        Member.logout();
        window.location.href = "index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", function () {
        Member.logout();
        renderSession();
        loginMsg.className = "msg ok";
        loginMsg.textContent = "已经退出登录。";
    });

    checkServer();
    loadRemote();
    refreshQuota();
    renderSession();
    renderAvatarPanel();
})();
</script>
