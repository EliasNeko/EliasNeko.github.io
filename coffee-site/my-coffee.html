<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的咖啡 · 龙潜猫隐的咖啡店</title>
<link rel="stylesheet" href="../assets/owner-badge.css?v=20261028" data-owner-badge="1">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 38px 18px 80px; background: radial-gradient(circle at 50% 0%, #33251a 0%, #14100e 62%); color: #f3e7d3; font-family: "Microsoft YaHei", sans-serif; }
    .wrap { width: min(720px, 100%); margin: 0 auto; }
    .back { display: inline-block; margin-bottom: 18px; color: rgba(201,183,156,.7); font-size: 13px; letter-spacing: 2px; text-decoration: none; }
    .back:hover { color: #c9a86a; }
    h1 { margin: 0 0 6px; font-size: 27px; font-weight: normal; letter-spacing: 5px; }
    .sub { margin: 0 0 20px; color: #c9b79c; font-size: 12.5px; line-height: 1.9; }
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
    .sum { padding: 13px 10px; border: 1px solid rgba(201,168,106,.22); border-radius: 12px; background: #1a1512; text-align: center; }
    .sum b { display: block; color: #e8d4a8; font-size: 19px; font-weight: normal; letter-spacing: 1px; }
    .sum span { color: rgba(201,183,156,.5); font-size: 10px; letter-spacing: 1px; }
    .section { margin-bottom: 18px; padding: 17px 18px; border: 1px solid rgba(201,168,106,.2); border-radius: 16px; background: #1a1512; }
    .section h2 { margin: 0 0 10px; color: #e8d4a8; font-size: 15px; font-weight: normal; letter-spacing: 3px; }
    .coffee { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px dashed rgba(201,168,106,.14); }
    .coffee:last-child { border-bottom: 0; }
    .pic { width: 62px; height: 62px; flex: 0 0 auto; border-radius: 10px; overflow: hidden; background: #2a2119; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .pic img { width: 100%; height: 100%; object-fit: cover; }
    .info { flex: 1; min-width: 0; }
    .info .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .info b { color: #e8d4a8; font-size: 14px; font-weight: normal; }
    .info .price { color: #c9a86a; font-size: 12px; }
    .info .status { margin-left: auto; padding: 1px 7px; border: 1px solid rgba(201,168,106,.3); border-radius: 999px; color: #c9a86a; font-size: 9.5px; letter-spacing: 1px; }
    .info .status.pending { color: #fcd34d; border-color: rgba(252,211,77,.35); }
    .info .status.rejected { color: #e29a8e; border-color: rgba(226,154,142,.35); }
    .info p { margin: 5px 0 0; color: rgba(201,183,156,.6); font-size: 11px; line-height: 1.8; }
    .empty { margin: 6px 0; color: rgba(201,183,156,.4); font-size: 11.5px; line-height: 1.9; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .actions a { padding: 9px 15px; border: 1px solid rgba(201,168,106,.4); border-radius: 999px; color: #e0c48c; font-size: 12px; text-decoration: none; }
    .actions a:hover { background: rgba(201,168,106,.1); }
    .note { color: rgba(201,183,156,.38); font-size: 10.5px; line-height: 1.9; margin-top: 12px; }
    @media (max-width: 560px) { .summary { grid-template-columns: repeat(2, 1fr); } .info .status { margin-left: 0; } }
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="index.html">← 回到店里</a>
    <h1>我 的 咖 啡</h1>
    <p class="sub">你上架的作品、还在等审核的投稿，以及它们替你赚到的钱。</p>

    <div class="summary">
        <div class="sum"><b id="sumEarn">—</b><span>累计咖啡收益</span></div>
        <div class="sum"><b id="sumCups">0</b><span>已售杯数</span></div>
        <div class="sum"><b id="sumOn">0</b><span>已上架</span></div>
        <div class="sum"><b id="sumWait">0</b><span>待审核</span></div>
    </div>

    <p class="note" id="earnHint" hidden>收益统计还需要运行 supabase/升级-我的咖啡.sql；跑完后刷新就能看到累计收益。</p>

    <section class="section">
        <h2>已上架</h2>
        <div id="approved"><p class="empty">正在读取…</p></div>
    </section>

    <section class="section">
        <h2>待上架</h2>
        <div id="pending"><p class="empty">正在读取…</p></div>
    </section>

    <section class="section" id="rejectedBox" hidden>
        <h2>被打回</h2>
        <div id="rejected"></div>
    </section>

    <div class="actions">
        <a href="coffee-submit.html">＋ 再制作一杯</a>
        <a href="index.html">回菜单看看</a>
    </div>
    <p class="note">收益来自云端订单，按售价全额进入制作者余额；退款 / 取消订单暂未开放。</p>
</div>

<script src="config.js?v=20261023"></script>
<script src="member.js?v=20261025"></script>
<script>
(function () {
    "use strict";
    var SB_URL = window.SUPABASE_URL || "";
    var SB_KEY = window.SUPABASE_KEY || "";
    var H = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };
    var me = Member.session();
    var LOCAL_KEY = me ? "coffee-my-submissions-v1:" + me.name : "";

    if (!me || !me.name || !me.hash) {
        document.body.innerHTML = '<p style="padding:60px;text-align:center;color:#c9b79c;line-height:2;">先登录才能看自己的咖啡。<br><br><a style="color:#c9a86a" href="account.html">去登录</a></p>';
        return;
    }

    function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function rpc(name, body) {
        return fetch(SB_URL + "/rest/v1/rpc/" + name, { method: "POST", headers: H, body: JSON.stringify(body || {}) })
            .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }

    function localPending() {
        try {
            var list = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
            return Object.prototype.toString.call(list) === "[object Array]" ? list : [];
        } catch (e) { return []; }
    }

    function card(c, status) {
        var pic = c.image ? '<img src="' + esc(c.image) + '" alt="">' : "☕️";
        var label = status === "approved" ? "已上架" : (status === "pending" ? "等站长审核" : "已打回");
        var note = c.review_note ? " · " + esc(c.review_note) : "";
        return '<div class="coffee"><div class="pic">' + pic + '</div><div class="info">' +
            '<div class="top"><b>' + esc(c.name) + '</b><span class="price">¥' + Number(c.price) + '</span>' +
            '<span class="status ' + status + '">' + label + '</span></div>' +
            '<p>' + esc(c.story || "").slice(0, 120) + (note ? '<br>' + note : '') + '</p></div></div>';
    }

    function render(data) {
        var approved = (data && data.approved) || [];
        var pending = (data && data.pending) || [];
        var rejected = (data && data.rejected) || [];
        var local = localPending();

        var seen = {};
        approved.forEach(function (c) { seen[c.id] = true; });
        pending.forEach(function (c) { seen[c.id] = true; });
        rejected.forEach(function (c) { seen[c.id] = true; });
        local.forEach(function (c) {
            if (!seen[c.id]) { pending.push(c); seen[c.id] = true; }
        });

        var hasEarn = !!(data && typeof data.earnings === "number");
        document.getElementById("sumEarn").textContent = hasEarn ? "¥ " + (Math.round(data.earnings * 100) / 100) : "—";
        document.getElementById("earnHint").hidden = hasEarn;
        document.getElementById("sumCups").textContent = (data && data.cups) || 0;
        document.getElementById("sumOn").textContent = approved.length;
        document.getElementById("sumWait").textContent = pending.length;

        document.getElementById("approved").innerHTML = approved.length
            ? approved.map(function (c) { return card(c, "approved"); }).join("")
            : '<p class="empty">还没有上架的咖啡。去「我也想制作咖啡」投一杯吧。</p>';

        document.getElementById("pending").innerHTML = pending.length
            ? pending.map(function (c) { return card(c, "pending"); }).join("")
            : '<p class="empty">没有待审核的咖啡。</p>';

        document.getElementById("rejectedBox").hidden = !rejected.length;
        document.getElementById("rejected").innerHTML = rejected.map(function (c) { return card(c, "rejected"); }).join("");
    }

    rpc("coffee_mine", { p_name: me.name, p_hash: me.hash }).then(function (d) {
        if (d && d.ok) { render(d); return; }
        /* 旧版还没运行 coffee_mine 时，至少把已上架和本机待审显示出来 */
        fetch(SB_URL + "/rest/v1/rpc/coffee_list", { method: "POST", headers: H, body: "{}" })
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (list) {
                var mine = (list || []).filter(function (c) { return c.maker === me.name; });
                render({ approved: mine, pending: [], rejected: [], earnings: null, cups: 0 });
            }).catch(function () { render({ approved: [], pending: [], rejected: [], earnings: null, cups: 0 }); });
    });
})();
</script>
</body>
</html>
