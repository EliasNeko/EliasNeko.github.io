<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人资料 · 龙潜猫隐的咖啡店</title>
<link rel="stylesheet" href="../assets/owner-badge.css?v=20261028" data-owner-badge="1">
<link rel="stylesheet" href="../assets/titles.css?v=20261032" data-titles-badge="1">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh; padding: 40px 20px 90px;
        font-family: "Microsoft YaHei", sans-serif; color: #f3e7d3;
        background: radial-gradient(circle at 50% 0%, #33251a 0%, #14100e 62%);
    }
    .wrap { width: min(520px, 100%); margin: 0 auto; }
    .back { display: inline-block; margin-bottom: 22px; color: rgba(201,183,156,.7); font-size: 13px; letter-spacing: 2px; text-decoration: none; }
    .back:hover { color: #c9a86a; }
    h1 { font-size: 26px; font-weight: normal; letter-spacing: 4px; margin-bottom: 8px; }
    .sub { color: #c9b79c; font-size: 13px; margin-bottom: 24px; line-height: 1.9; }

    .card { padding: 24px 22px; background: #1a1512; border: 1px solid rgba(201,168,106,.22); border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.45); }

    .top-row { display: flex; gap: 20px; align-items: center; margin-bottom: 22px; }
    .avatar-big { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(201,168,106,.5); background: #14100e; }
    .top-info { flex: 1; min-width: 0; }
    .name { font-size: 20px; letter-spacing: 2px; margin-bottom: 6px; }
    .since { font-size: 12px; color: rgba(201,183,156,.5); letter-spacing: 1px; }

    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 7px; color: #c9b79c; font-size: 12px; letter-spacing: 2px; }
    input[type="text"], input[type="email"] {
        width: 100%; padding: 12px 14px; border: 1px solid rgba(201,168,106,.22); border-radius: 10px;
        background: #14100e; color: #f3e7d3; font-family: inherit; font-size: 14px; outline: none;
    }
    input:focus { border-color: rgba(201,168,106,.6); }
    input[readonly] { opacity: .55; }

    .avatar-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    input[type="file"] { color: #c9b79c; font-size: 12px; }

    .submit {
        width: 100%; margin-top: 8px; padding: 13px 20px; border: 1px solid #c9a86a; border-radius: 999px;
        background: #c9a86a; color: #14100e; font-family: inherit; font-size: 14px; letter-spacing: 4px; cursor: pointer;
    }
    .submit:hover { background: #dcbe86; }
    .submit:disabled { opacity: .45; cursor: not-allowed; }

    .msg { min-height: 22px; margin-top: 14px; font-size: 13px; letter-spacing: 1px; }
    .msg.ok { color: #9ec9a0; }
    .msg.err { color: #e29a8e; }

    .hint { margin-top: 6px; color: rgba(201,183,156,.45); font-size: 12px; line-height: 1.8; }
    .foot { margin-top: 24px; text-align: center; color: rgba(201,183,156,.35); font-size: 11.5px; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="wrap">
    <a class="back" href="index.html">← 回到店里</a>
    <h1>个 人 资 料</h1>
    <p class="sub">这里能看到你注册时填的东西，也能改。</p>

    <div class="card">
        <div class="top-row">
            <img class="avatar-big" id="avatar" alt="">
            <div class="top-info">
                <p class="name" id="name">…</p>
                <p class="owner-line" id="ownerLine" style="display:none;">这家店的主人 · 从 2026 年秋天开始看店</p>
                <p class="since" id="since"></p>
            </div>
        </div>

        <div class="field">
            <label for="contact">QQ 号 或 微信号</label>
            <input type="text" id="contact" placeholder="留一个能找到你的">
        </div>

        <div class="field">
            <label for="email">邮箱（选填）</label>
            <input type="email" id="email" placeholder="不填也可以">
        </div>

        <div class="field">
            <label>头像</label>
            <div class="avatar-tools">
                <input type="file" id="avatarFile" accept="image/*">
                <span class="hint" id="avatarHint" style="margin:0;">换一张，会先给你预览</span>
            </div>
        </div>

        <button class="submit" id="saveBtn" type="button">保 存 修 改</button>
        <p class="msg" id="msg"></p>
    </div>

    <section class="titles-panel" id="titlesPanel"></section>

    <p class="foot">© 2026 龙潜猫隐</p>
</div>

<script src="config.js?v=20261024"></script>
<script src="member.js?v=20261025"></script>
<script src="../assets/titles.js?v=20261032"></script>
<script>
(function () {
    "use strict";

    var SB_URL = window.SUPABASE_PROXY || window.SUPABASE_URL || "";
    var SB_KEY = window.SUPABASE_KEY || "";
    var HEADERS = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" };

    var me = (function () { try { return JSON.parse(localStorage.getItem("coffee-session") || "null"); } catch (e) { return null; } })();

    if (!SB_URL || !SB_KEY || !me || !me.name) {
        document.body.innerHTML = '<p style="padding:60px;text-align:center;color:#c9b79c;">先登录才能看个人资料。<br><br><a style="color:#c9a86a" href="account.html">去登录</a></p>';
        return;
    }
    if (!me.hash) {
        document.body.innerHTML = '<p style="padding:60px;text-align:center;color:#c9b79c;">登录信息过期了，重新登录一次就能看资料。<br><br><a style="color:#c9a86a" href="account.html">重新登录</a></p>';
        return;
    }

    var pendingAvatar = "";
    var msg = document.getElementById("msg");

    function setMsg(text, ok) {
        msg.className = "msg " + (ok ? "ok" : "err");
        msg.textContent = text;
    }

    function rpc(name, body) {
        return fetch(SB_URL + "/rest/v1/rpc/" + name, {
            method: "POST",
            headers: HEADERS,
            body: JSON.stringify(body)
        }).then(function (r) { return r.ok ? r.json() : null; });
    }

    /* 读资料 */
    var cloudReady = window.Titles ? Titles.loadCloud() : Promise.resolve();
    Promise.all([cloudReady, rpc("get_profile", { p_name: me.name, p_hash: me.hash })]).then(function (res) {
        var d = res[1];
        if (!d || !d.ok) { setMsg("读不到资料，重新登录一下。", false); return; }

        var titleApi = window.Titles || null;
        document.getElementById("name").innerHTML = titleApi
            ? titleApi.nameHTML(d.name, "lg")
            : Member.displayName(d.name, "lg");
        document.getElementById("since").textContent = d.time ? "注册于 " + d.time : "";

        if (Member.isOwner(d.name)) {
            document.querySelector(".card").classList.add("owner-card");
            document.getElementById("avatar").classList.add("owner-avatar-ring");
            document.getElementById("ownerLine").style.display = "block";
            document.getElementById("since").textContent = d.time ? "注册于 " + d.time : "";
        }

        if (titleApi) {
            titleApi.renderPanel(d.name, document.getElementById("titlesPanel"));
            var tone = titleApi.sealedTone(d.name);
            if (tone === "purple") {
                document.querySelector(".card").classList.add("sealed-card");
                document.getElementById("avatar").classList.add("sealed-avatar-ring");
                var line = document.getElementById("ownerLine");
                line.textContent = "站长亲封 · 申鹤的🐶";
                line.style.display = "block";
            }
        }
        document.getElementById("contact").value = d.contact || "";
        document.getElementById("email").value = d.email || "";

        if (d.avatar) {
            document.getElementById("avatar").src = d.avatar;
            try { localStorage.setItem("coffee-avatar:" + me.name, d.avatar); } catch (e) {}
        } else {
            try {
                var cached = localStorage.getItem("coffee-avatar:" + me.name);
                if (cached) document.getElementById("avatar").src = cached;
            } catch (e) {}
        }
    }).catch(function () { setMsg("连不上云端，稍后再试。", false); });

    /* 选头像：压到 160×160，个人页看得清一点 */
    document.getElementById("avatarFile").addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { setMsg("图片太大了，换一张小于 8MB 的。", false); return; }

        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
            var canvas = document.createElement("canvas");
            canvas.width = 160;
            canvas.height = 160;
            var ctx = canvas.getContext("2d");
            var s = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 160, 160);
            URL.revokeObjectURL(url);

            pendingAvatar = canvas.toDataURL("image/jpeg", 0.82);
            document.getElementById("avatar").src = pendingAvatar;
            document.getElementById("avatarHint").textContent = "看起来不错，点保存生效";
            setMsg("", true);
        };
        img.onerror = function () { setMsg("这张图读不出来。", false); };
        img.src = url;
    });

    /* 保存 */
    document.getElementById("saveBtn").addEventListener("click", function () {
        var contact = document.getElementById("contact").value.trim();
        var email = document.getElementById("email").value.trim();

        if (!contact) { setMsg("QQ 或微信总得留一个。", false); return; }
        if (email && email.indexOf("@") < 0) { setMsg("邮箱格式看着不对。", false); return; }

        setMsg("正在保存…", true);
        document.getElementById("saveBtn").disabled = true;

        rpc("update_profile", {
            p_name: me.name,
            p_hash: me.hash,
            p_contact: contact,
            p_email: email,
            p_avatar: pendingAvatar
        }).then(function (out) {
            document.getElementById("saveBtn").disabled = false;
            if (out && out.ok) {
                if (pendingAvatar) {
                    try { localStorage.setItem("coffee-avatar:" + me.name, pendingAvatar); } catch (e) {}
                }
                pendingAvatar = "";
                setMsg("保存好了。", true);
            } else {
                setMsg(out && out.error === "auth" ? "身份校验没过，重新登录一下。" : "没存上，稍后再试。", false);
            }
        }).catch(function () {
            document.getElementById("saveBtn").disabled = false;
            setMsg("连不上云端，稍后再试。", false);
        });
    });
})();
</script>
    <script src="../assets/chat.js?v=20261031"></script>
    <script src="../assets/update-popup.js?v=20261023"></script>
    <script src="../assets/live.js?v=20261025"></script>
</body>
</html>
